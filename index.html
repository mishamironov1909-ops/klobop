<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070914">
<title>Klobop</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070914;color:#fff;font-family:Inter,Arial,sans-serif}
body{user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}

#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
button,.click{pointer-events:auto}

#menu{
 position:absolute;inset:0;overflow:auto;
 padding:28px 18px 50px;
 background:
 radial-gradient(circle at 15% 15%,#613cff55,transparent 28%),
 radial-gradient(circle at 85% 20%,#00eaff38,transparent 25%),
 linear-gradient(145deg,#090b19,#11162c 50%,#060710);
 animation:appear .5s ease
}
@keyframes appear{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}

.logo{
 width:max-content;margin:20px auto 3px;
 font-size:clamp(55px,12vw,115px);
 font-weight:1000;letter-spacing:-8px;
 font-style:italic;
 background:linear-gradient(90deg,#fff,#5eefff,#9670ff,#fff);
 background-size:300%;
 -webkit-background-clip:text;color:transparent;
 animation:logo 5s linear infinite;
 filter:drop-shadow(0 0 20px #39eaff55)
}
@keyframes logo{to{background-position:300%}}

.subtitle{text-align:center;color:#8790b7;letter-spacing:5px;font-size:11px;margin-bottom:25px}

.topButtons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}

.btn{
 border:1px solid #ffffff1c;
 border-radius:14px;
 padding:12px 17px;
 color:#fff;
 font-weight:900;
 background:#ffffff0d;
 box-shadow:0 8px 30px #0004;
 transition:.15s;
}
.btn:hover{transform:translateY(-3px);background:#ffffff18;border-color:#53eaff77}
.btn:active{transform:translateY(1px) scale(.98)}
.primary{
 background:linear-gradient(135deg,#00d9ff,#6d4cff);
 border:0;
 box-shadow:0 0 30px #4a70ff55;
}

.stats{
 width:min(900px,96vw);
 margin:auto;
 display:flex;justify-content:center;gap:10px;flex-wrap:wrap
}
.stat{
 min-width:125px;padding:12px 18px;border-radius:17px;
 background:#ffffff09;border:1px solid #ffffff12;
 backdrop-filter:blur(12px)
}
.stat small{display:block;color:#858dae;font-size:10px}
.stat b{font-size:19px}

.title{
 text-align:center;font-size:25px;font-weight:1000;margin:30px 0 14px
}

#places{
 width:min(1100px,96vw);
 margin:auto;
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:13px
}

.place{
 position:relative;
 min-height:170px;
 padding:18px;
 text-align:left;
 overflow:hidden;
 border-radius:23px;
 border:1px solid #ffffff18;
 background:linear-gradient(145deg,#151b38dd,#080b19ee);
 box-shadow:0 12px 40px #0006;
 transition:.22s;
}
.place:hover{transform:translateY(-7px) scale(1.015);border-color:#5beaff66}
.place:active{transform:scale(.98)}
.place:before{
 content:"";
 position:absolute;
 width:130px;height:130px;
 right:-45px;top:-45px;
 border-radius:50%;
 background:var(--c);
 filter:blur(45px);
 opacity:.35;
}
.placeIcon{font-size:48px;position:relative}
.place h3{margin:9px 0 7px;font-size:20px;position:relative}
.place p{margin:0;color:#9299b8;font-size:12px;line-height:1.45;position:relative}
.playTag{
 position:absolute;right:13px;bottom:13px;
 padding:7px 10px;border-radius:10px;
 background:#ffffff0c;color:#7eeeff;
 font-size:10px;font-weight:1000
}

#gameUI{
 display:none;
 position:absolute;inset:0;
 pointer-events:none
}
#hud{
 position:absolute;top:14px;left:14px;right:14px;
 display:flex;align-items:center;justify-content:space-between;gap:8px
}
.hudbox{
 padding:10px 13px;border-radius:14px;
 background:#080d20cc;border:1px solid #ffffff18;
 backdrop-filter:blur(10px);
 box-shadow:0 8px 30px #0005;
 font-weight:900
}
#gameTitle{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#back{
 pointer-events:auto;
 background:#ffffff12;
 border:1px solid #ffffff18;
 border-radius:12px;
 padding:9px 12px;color:white;font-weight:900
}

#mobile{
 position:absolute;left:15px;right:15px;bottom:15px;
 display:flex;justify-content:space-between;
 pointer-events:none
}
.mgroup{display:flex;gap:9px}
.mbtn{
 pointer-events:auto;
 width:62px;height:62px;
 border-radius:18px;
 background:#0b1230dd;
 border:1px solid #ffffff20;
 color:#fff;font-size:24px;font-weight:1000;
 box-shadow:0 8px 25px #0006;
 touch-action:none
}
.mbtn:active{transform:scale(.92);background:#2444aadd}

#modal{
 display:none;position:absolute;inset:0;
 background:#0009;backdrop-filter:blur(9px);
 align-items:center;justify-content:center;
 padding:18px;
 pointer-events:auto
}
.modal{
 width:min(650px,95vw);max-height:85vh;overflow:auto;
 border-radius:24px;padding:22px;
 background:linear-gradient(145deg,#171d3b,#080b18);
 border:1px solid #ffffff20;
 box-shadow:0 25px 100px #000;
}
.modal h2{margin:0 0 10px}
.close{float:right}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.item{padding:15px;border-radius:16px;background:#ffffff08;border:1px solid #ffffff12;text-align:center}
.itemIcon{font-size:38px}
.item button{margin-top:9px;padding:7px 10px;border:0;border-radius:9px;background:#40dfff;color:#06101c;font-weight:900}

.toast{
 position:absolute;left:50%;top:80px;
 transform:translateX(-50%) translateY(-20px);
 opacity:0;
 padding:12px 18px;border-radius:14px;
 background:#111936ee;border:1px solid #ffffff20;
 transition:.25s;white-space:nowrap
}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:600px){
 #places{grid-template-columns:repeat(2,1fr);gap:9px}
 .place{min-height:145px;padding:13px}
 .placeIcon{font-size:35px}
 .place h3{font-size:15px}
 .place p{font-size:10px}
 .stat{min-width:100px}
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="ui">

<section id="menu">

<div class="logo">Klobop</div>
<div class="subtitle">FREE WORLDS • PLAY • CREATE • EXPLORE</div>

<div class="topButtons">
<button class="btn primary" id="randomBtn">⚡ СЛУЧАЙНЫЙ ПЛЕЙС</button>
<button class="btn" id="shopBtn">🛍️ МАГАЗИН</button>
<button class="btn" id="invBtn">🎒 ИНВЕНТАРЬ</button>
<button class="btn" id="nameBtn">✏️ ИМЯ</button>
</div>

<div class="stats">
<div class="stat"><small>ИГРОК</small><b id="name">Klobop</b></div>
<div class="stat"><small>МОНЕТЫ</small><b>💰 <span id="coins">250</span></b></div>
<div class="stat"><small>XP</small><b>⭐ <span id="xp">0</span></b></div>
<div class="stat"><small>ПОБЕДЫ</small><b>🏆 <span id="wins">0</span></b></div>
</div>

<div class="title">🌎 Выбери свой мир</div>
<div id="places"></div>

</section>


<section id="gameUI">

<div id="hud">
<div class="hudbox" id="gameTitle">Klobop</div>
<div class="hudbox">💰 <span id="gameCoins">250</span> &nbsp; ⭐ <span id="gameXP">0</span></div>
<button id="back">☰ Меню</button>
</div>

<div class="toast" id="toast"></div>

<div id="mobile">
<div class="mgroup">
<button class="mbtn" id="left">◀</button>
<button class="mbtn" id="right">▶</button>
</div>
<div class="mgroup">
<button class="mbtn" id="jump">↑</button>
<button class="mbtn" id="act">●</button>
</div>
</div>

</section>


<div id="modal">
<div class="modal">
<button class="btn close" id="close">✕</button>
<h2 id="modalTitle"></h2>
<div id="modalContent"></div>
</div>
</div>

</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
 W=innerWidth;H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

const KEY="KLOBOP_SAVE_2";

let save={
 name:"Klobop",
 coins:250,
 xp:0,
 wins:0,
 skin:"default",
 owned:["default"]
};

try{
 const s=JSON.parse(localStorage.getItem(KEY));
 if(s)save={...save,...s};
}catch(e){}

function saveGame(){
 localStorage.setItem(KEY,JSON.stringify(save));
 updateStats();
}

function updateStats(){
 document.getElementById("name").textContent=save.name;
 document.getElementById("coins").textContent=save.coins;
 document.getElementById("xp").textContent=save.xp;
 document.getElementById("wins").textContent=save.wins;
 document.getElementById("gameCoins").textContent=save.coins;
 document.getElementById("gameXP").textContent=save.xp;
}

const places=[
["city","🏙️","Klobop City","Неоновый город с улицами, зданиями и секретами.","#4d7cff"],
["obby","🏃","Mega Obby","Безумный паркур. Прыгай по платформам и доберись до финиша.","#b35cff"],
["island","🏝️","Klobop Island","Огромный остров, океан, пальмы и спрятанные монеты.","#27d9ff"],
["arena","⚔️","Battle Arena","Арена с врагами. Побеждай их и получай награды.","#ff4d78"],
["space","🚀","Space Base","Космическая станция, планеты и платформы в невесомости.","#785cff"],
["forest","🌲","Mystic Forest","Магический лес с деревьями, кристаллами и тайниками.","#38d979"],
["race","🏎️","Klobop Racing","Неоновая трасса и ускорители. Гони как можно быстрее.","#ff48d0"],
["build","🏗️","Build Zone","Строй собственные платформы прямо во время игры.","#ffb83d"]
];

const skins=[
["default","🙂","Classic"],
["blue","🔵","Blue"],
["fire","🔥","Fire"],
["robot","🤖","Robot"],
["alien","👽","Alien"],
["ninja","🥷","Ninja"],
["crown","👑","Royal"],
["ghost","👻","Ghost"],
["star","⭐","Star"],
["rainbow","🌈","Rainbow"]
];

const placesEl=document.getElementById("places");

places.forEach(p=>{
 const b=document.createElement("button");
 b.className="place";
 b.style.setProperty("--c",p[4]);
 b.innerHTML=`
 <div class="placeIcon">${p[1]}</div>
 <h3>${p[2]}</h3>
 <p>${p[3]}</p>
 <span class="playTag">PLAY →</span>`;
 b.addEventListener("click",()=>start(p[0]));
 placesEl.appendChild(b);
});

const menu=document.getElementById("menu");
const gameUI=document.getElementById("gameUI");
const modal=document.getElementById("modal");

function showModal(title,html){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalContent").innerHTML=html;
 modal.style.display="flex";
}

document.getElementById("close").onclick=()=>modal.style.display="none";

document.getElementById("shopBtn").onclick=()=>{
 let html=`<p style="color:#8e96b5">Все предметы доступны бесплатно.</p><div class="items">`;
 skins.forEach(s=>{
  const owned=save.owned.includes(s[0]);
  html+=`
  <div class="item">
   <div class="itemIcon">${s[1]}</div>
   <b>${s[2]}</b>
   <button data-skin="${s[0]}">${owned?"НАДЕТЬ":"ПОЛУЧИТЬ"}</button>
  </div>`;
 });
 html+="</div>";
 showModal("🛍️ Бесплатный магазин",html);

 document.querySelectorAll("[data-skin]").forEach(btn=>{
  btn.onclick=()=>{
   const id=btn.dataset.skin;
   if(!save.owned.includes(id))save.owned.push(id);
   save.skin=id;
   saveGame();
   document.getElementById("modal").style.display="none";
  };
 });
};

document.getElementById("invBtn").onclick=()=>{
 let html=`<p style="color:#8e96b5">Выбери своего персонажа.</p><div class="items">`;
 skins.filter(s=>save.owned.includes(s[0])).forEach(s=>{
  html+=`
  <div class="item">
   <div class="itemIcon">${s[1]}</div>
   <b>${s[2]}</b>
   <button data-equip="${s[0]}">${save.skin===s[0]?"НАДЕТО":"НАДЕТЬ"}</button>
  </div>`;
 });
 html+="</div>";
 showModal("🎒 Инвентарь",html);

 document.querySelectorAll("[data-equip]").forEach(btn=>{
  btn.onclick=()=>{
   save.skin=btn.dataset.equip;
   saveGame();
   modal.style.display="none";
  };
 });
};

document.getElementById("nameBtn").onclick=()=>{
 const n=prompt("Имя игрока:",save.name);
 if(n&&n.trim()){
  save.name=n.trim().slice(0,18);
  saveGame();
 }
};

document.getElementById("randomBtn").onclick=()=>{
 start(places[Math.floor(Math.random()*places.length)][0]);
};

let game=false;
let world=null;
let currentType="";
let last=0;
let cam=0;
let time=0;
let particles=[];
let keys={};

const player={
 x:300,y:200,w:34,h:48,vx:0,vy:0,
 speed:6,jump:-13,onGround:false,dir:1
};

function inputKey(e){
 keys[e.code]=true;
 if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))e.preventDefault();
}
function inputUp(e){keys[e.code]=false}
addEventListener("keydown",inputKey);
addEventListener("keyup",inputUp);

function hold(id,code){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[code]=true;
  el.setPointerCapture?.(e.pointerId);
 });
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  el.addEventListener(ev,e=>{
   e.preventDefault();
   keys[code]=false;
  });
 });
}
hold("left","ArrowLeft");
hold("right","ArrowRight");

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(player.onGround)player.vy=-13;
});

document.getElementById("act").addEventListener("pointerdown",e=>{
 e.preventDefault();
 action();
});

document.getElementById("back").onclick=leave;

function start(type){
 currentType=type;
 world=createWorld(type);
 player.x=260;
 player.y=300;
 player.vx=0;
 player.vy=0;
 player.onGround=false;
 cam=0;
 time=0;
 particles=[];
 game=true;
 menu.style.display="none";
 gameUI.style.display="block";
 document.getElementById("gameTitle").textContent=
 places.find(x=>x[0]===type)[1]+" "+places.find(x=>x[0]===type)[2];
 updateStats();
 last=performance.now();
 requestAnimationFrame(loop);
}

function leave(){
 game=false;
 gameUI.style.display="none";
 menu.style.display="block";
}

function block(x,y,w,h,type="platform"){
 return{x,y,w,h,type};
}

function createWorld(type){
 const o={
  width:6000,
  gravity:.72,
  solids:[],
  coins:[],
  enemies:[],
  decor:[],
  goal:null
 };
 const gy=H*.76;

 o.solids.push(block(0,gy,6000,500,"ground"));

 if(type==="city"){
  o.width=7000;
  for(let x=200;x<6800;x+=280){
   const h=100+Math.random()*260;
   o.solids.push(block(x,gy-h,190,h,"building"));
   if(Math.random()<.8)o.decor.push({t:"window",x:x+35,y:gy-h+40});
   if(Math.random()<.8)o.decor.push({t:"window",x:x+100,y:gy-h+80});
  }
  for(let i=0;i<25;i++)o.coins.push({x:300+i*260,y:gy-80-Math.random()*130});
 }
 if(type==="obby"){
  o.width=6500;
  o.solids=[];
  o.solids.push(block(0,gy,500,500,"ground"));
  let x=500;
  for(let i=0;i<45;i++){
   x+=110+Math.random()*75;
   let y=gy-80-Math.random()*260;
   o.solids.push(block(x,y,100,28,"platform"));
   if(i%2===0)o.coins.push({x:x+45,y:y-45});
  }
 }
 if(type==="island"){
  o.width=6500;
  o.solids=[];
  o.solids.push(block(0,gy,1000,500,"ground"));
  o.solids.push(block(1250,gy+70,900,500,"ground"));
  o.solids.push(block(2450,gy-10,1000,500,"ground"));
  o.solids.push(block(3800,gy+40,2700,500,"ground"));
  for(let i=0;i<35;i++)o.decor.push({t:"palm",x:100+i*180,y:gy-120});
  for(let i=0;i<30;i++)o.coins.push({x:180+i*210,y:gy-80-Math.random()*140});
 }
 if(type==="arena"){
  o.width=4000;
  for(let i=0;i<11;i++)o.enemies.push({x:450+i*300,y:gy-45,w:36,h:45,vx:1,hp:3,alive:true});
  for(let i=0;i<25;i++)o.coins.push({x:250+i*145,y:gy-80-Math.random()*170});
 }
 if(type==="space"){
  o.width=7000;
  o.gravity=.35;
  o.solids=[];
  o.solids.push(block(0,gy,700,500,"ground"));
  for(let i=0;i<45;i++){
   let x=850+i*140;
   let y=150+Math.random()*(gy-230);
   o.solids.push(block(x,y,100,25,"platform"));
   if(i%2===0)o.coins.push({x:x+45,y:y-45});
  }
  for(let i=0;i<15;i++)o.decor.push({t:"planet",x:Math.random()*7000,y:80+Math.random()*350});
 }
 if(type==="forest"){
  o.width=6500;
  for(let i=0;i<40;i++)o.decor.push({t:"tree",x:100+i*160,y:gy-170});
  for(let i=0;i<30;i++)o.coins.push({x:180+i*210,y:gy-80-Math.random()*150});
 }
 if(type==="race"){
  o.width=8500;
  for(let i=0;i<65;i++)o.coins.push({x:150+i*125,y:gy-55});
  for(let i=0;i<18;i++)o.solids.push(block(700+i*420,gy-70-Math.random()*100,100,40,"ramp"));
 }
 if(type==="build"){
  o.width=6500;
  for(let i=0;i<25;i++){
   o.solids.push(block(500+i*230,gy-60-(i%5)*50,90,50,"build"));
  }
 }
 o.goal={x:o.width-180,y:gy-150,w:60,h:150};
 return o;
}

function hit(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function update(dt){
 const d=Math.min(2,dt/16.67);
 time+=dt;

 const left=keys.ArrowLeft||keys.KeyA;
 const right=keys.ArrowRight||keys.KeyD;

 if(left){player.vx-=.8*d;player.dir=-1}
 if(right){player.vx+=.8*d;player.dir=1}
 player.vx*=Math.pow(.78,d);
 player.vx=Math.max(-player.speed,Math.min(player.speed,player.vx));

 if((keys.Space||keys.ArrowUp||keys.KeyW)&&player.onGround){
  player.vy=-13;
  player.onGround=false;
  keys.Space=keys.ArrowUp=keys.KeyW=false;
 }

 player.vy+=world.gravity*d;
 player.x+=player.vx*d;
 player.y+=player.vy*d;
 player.onGround=false;

 for(const s of world.solids){
  if(hit(player,s)){
   const oldBottom=player.y-player.vy*d+player.h;
   if(oldBottom<=s.y+12&&player.vy>=0){
    player.y=s.y-player.h;
    player.vy=0;
    player.onGround=true;
   }else if(player.x+player.w/2<s.x+s.w/2){
    player.x=s.x-player.w;
    player.vx=0;
   }else{
    player.x=s.x+s.w;
    player.vx=0;
   }
  }
 }

 for(const c of world.coins){
  if(c.got)continue;
  if(Math.hypot(player.x+17-c.x,player.y+24-c.y)<34){
   c.got=true;
   save.coins+=10;
   save.xp+=5;
   saveGame();
   burst(c.x,c.y,"#ffe34c",12);
  }
 }

 for(const e of world.enemies){
  if(!e.alive)continue;
  e.x+=e.vx*d;
  if(Math.abs(e.x-player.x)<500)e.vx=player.x<e.x?-1:1;
  if(hit(player,e)){
   if(player.vy>3){
    e.hp--;
    player.vy=-9;
    if(e.hp<=0){
     e.alive=false;
     save.coins+=25;
     save.xp+=20;
     saveGame();
    }
    burst(e.x,e.y,"#ff5477",15);
   }
  }
 }

 if(player.y>H+500){
  player.x=Math.max(100,player.x-400);
  player.y=100;
  player.vy=0;
 }

 if(hit(player,world.goal)){
  finish();
 }

 cam+=(player.x-W*.35-cam)*.1;
 cam=Math.max(0,Math.min(world.width-W,cam));

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx*d;
  p.y+=p.vy*d;
  p.vy+=.15*d;
  p.life-=.025*d;
  if(p.life<=0)particles.splice(i,1);
 }
}

function action(){
 if(currentType==="build"){
  const x=Math.round((player.x+player.dir*80)/50)*50;
  const y=Math.round((player.y+player.h)/50)*50;
  world.solids.push(block(x,y-50,50,50,"build"));
  burst(x,y-25,"#b45cff",10);
 }else{
  save.coins++;
  save.xp++;
  saveGame();
  burst(player.x+player.dir*40,player.y+20,"#45eaff",6);
 }
}

function finish(){
 game=false;
 save.wins++;
 save.coins+=100;
 save.xp+=100;
 saveGame();
 toast("🏆 Плейс пройден! +100 💰 +100 XP");
 setTimeout(leave,1300);
}

function burst(x,y,color,n){
 for(let i=0;i<n;i++){
  particles.push({
   x,y,
   vx:(Math.random()-.5)*8,
   vy:(Math.random()-.5)*8,
   life:1,color
  });
 }
}

function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);

 const colors={
  city:["#18244b","#060914"],
  obby:["#28134d","#070912"],
  island:["#31c4e5","#07506b"],
  arena:["#3b1529","#090611"],
  space:["#04051a","#13072f"],
  forest:["#16443b","#061511"],
  race:["#3b123e","#090611"],
  build:["#27374d","#080c14"]
 };

 const c=colors[currentType]||["#17203f","#060914"];
 g.addColorStop(0,c[0]);
 g.addColorStop(1,c[1]);
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 for(let i=0;i<90;i++){
  const x=(i*173-cam*.08)%W;
  const y=(i*83)%(H*.7);
  ctx.globalAlpha=.15+Math.sin(time/700+i)*.1;
  ctx.fillStyle="#fff";
  ctx.fillRect(x<0?x+W:x,y,2,2);
 }
 ctx.globalAlpha=1;

 if(currentType==="island"){
  ctx.fillStyle="#48dfff";
  ctx.fillRect(0,H*.78,W,H*.22);
 }
}

function drawWorld(){
 for(const d of world.decor){
  const x=d.x-cam,y=d.y;
  if(d.t==="tree"){
   ctx.fillStyle="#63412b";
   ctx.fillRect(x,y,25,170);
   ctx.fillStyle="#20905a";
   ctx.beginPath();ctx.arc(x+12,y,55,0,Math.PI*2);ctx.fill();
  }
  if(d.t==="palm"){
   ctx.strokeStyle="#71452a";
   ctx.lineWidth=14;
   ctx.beginPath();ctx.moveTo(x+10,y+150);ctx.lineTo(x,y);ctx.stroke();
   ctx.fillStyle="#39c466";
   for(let a=0;a<Math.PI*2;a+=Math.PI/4){
    ctx.beginPath();
    ctx.ellipse(x,y,70,11,a,0,Math.PI*2);
    ctx.fill();
   }
  }
  if(d.t==="window"){
   ctx.fillStyle="#ffe45d";
   ctx.shadowBlur=15;
   ctx.shadowColor="#ffe45d";
   ctx.fillRect(x,y,16,25);
   ctx.shadowBlur=0;
  }
  if(d.t==="planet"){
   ctx.fillStyle="#6954d9";
   ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle="#b9aaff";
   ctx.lineWidth=5;
   ctx.beginPath();ctx.ellipse(x,y,48,12,.2,0,Math.PI*2);ctx.stroke();
  }
 }

 for(const s of world.solids){
  const x=s.x-cam,y=s.y;
  if(x+s.w<0||x>W)continue;

  let col="#253b6d";
  if(s.type==="platform")col="#7658e8";
  if(s.type==="building")col="#26366a";
  if(s.type==="ramp")col="#dc4cff";
  if(s.type==="build")col="#b05cff";
  ctx.fillStyle=col;
  ctx.fillRect(x,y,s.w,s.h);
  ctx.fillStyle="#ffffff16";
  ctx.fillRect(x,y,s.w,5);

  if(s.type==="building"){
   ctx.fillStyle="#ffe35d";
   for(let xx=x+20;xx<x+s.w-15;xx+=45)
    for(let yy=y+30;yy<y+s.h-20;yy+=55)
     ctx.fillRect(xx,yy,15,21);
  }
 }

 for(const c of world.coins){
  if(c.got)continue;
  const x=c.x-cam,y=c.y;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(time/500);
  ctx.fillStyle="#ffe34c";
  ctx.shadowBlur=18;
  ctx.shadowColor="#ffe34c";
  ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
  ctx.restore();
 }

 for(const e of world.enemies){
  if(!e.alive)continue;
  const x=e.x-cam,y=e.y;
  ctx.fillStyle="#ff4c70";
  ctx.beginPath();ctx.roundRect(x,y,e.w,e.h,8);ctx.fill();
  ctx.fillStyle="#fff";
  ctx.fillRect(x+7,y+10,6,6);
  ctx.fillRect(x+23,y+10,6,6);
 }

 const gx=world.goal.x-cam;
 ctx.fillStyle="#54ff9c";
 ctx.shadowBlur=25;
 ctx.shadowColor="#54ff9c";
 ctx.fillRect(gx,world.goal.y,world.goal.w,world.goal.h);
 ctx.shadowBlur=0;

 drawPlayer();

 for(const p of particles){
  ctx.globalAlpha=p.life;
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x-cam,p.y,5*p.life,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;
}

function drawPlayer(){
 const x=player.x-cam+17;
 const y=player.y+24;
 const skin=skins.find(s=>s[0]===save.skin)||skins[0];

 let color="#4ceaff";
 if(save.skin==="fire")color="#ff573d";
 if(save.skin==="robot")color="#aeb8c8";
 if(save.skin==="alien")color="#62ff82";
 if(save.skin==="ninja")color="#765cff";
 if(save.skin==="ghost")color="#d9ecff";
 if(save.skin==="star")color="#ffe34c";
 if(save.skin==="rainbow")color=`hsl(${time/4%360},90%,60%)`;

 ctx.save();
 ctx.translate(x,y);
 ctx.scale(player.dir,1);
 ctx.shadowBlur=20;
 ctx.shadowColor=color;

 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(-17,-24,34,42,9);
 ctx.fill();

 ctx.shadowBlur=0;

 ctx.fillStyle="#071020";
 ctx.fillRect(-10,-13,6,7);
 ctx.fillRect(4,-13,6,7);
 ctx.fillRect(-8,3,16,4);

 if(save.skin==="crown"){
  ctx.fillStyle="#ffe34c";
  ctx.beginPath();
  ctx.moveTo(-17,-24);ctx.lineTo(-11,-40);ctx.lineTo(-3,-29);
  ctx.lineTo(5,-41);ctx.lineTo(16,-24);ctx.closePath();ctx.fill();
 }

 ctx.restore();
}

function loop(now){
 if(!game)return;
 const dt=Math.min(40,now-last||16);
 last=now;
 update(dt);
 drawBackground();
 drawWorld();
 requestAnimationFrame(loop);
}

function toast(text){
 const t=document.getElementById("toast");
 t.textContent=text;
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),1100);
}

updateStats();
</script>
</body>
